# Phong cách tiktok_retention: cắt rất nhanh, bỏ mọi khoảng lặng, phụ đề nhảy từng cụm, zoom liên tục.
name: tiktok_retention
name_vi: Cắt nhanh giữ chân (TikTok)
fits_vi: nội dung nói nhiều, cần nhịp nhanh, đa số video TikTok
description_vi: Cắt rất nhanh, bỏ mọi khoảng lặng, phụ đề nhảy từng cụm từ, zoom liên tục.

# Hướng dẫn cho đạo diễn (ghép vào prompt kế hoạch dựng)
director_brief: |
  - Nhịp rất nhanh: mỗi clip thường 1.5–5 giây; cắt bỏ khoảng lặng > 0.3 giây, câu vấp, lặp ý, đoạn chào hỏi.
  - Có thể tăng tốc đoạn nhàm (speed 1.1–1.5), không tăng tốc chỗ có câu thoại quan trọng.
  - Zoom: "punch" (giật nhanh 1.0→1.15) ở điểm nhấn/phản ứng, khoảng mỗi 4–8 giây; "slow" (1.0→1.1) cho đoạn kể.
  - Chữ nhấn (emphasis): từ khóa ngắn bằng ngôn ngữ video, tối đa 1 chữ nhấn / 5 giây.
  - SFX: pop/whoosh ở chữ nhấn và chuyển đoạn, không quá dày.
  - Nhạc nền năng lượng cao nhưng hạ thấp khi có thoại.

# Tham số cho bộ dựng (code dùng trực tiếp)
subtitle:
  mode: chunk           # chunk = từng cụm ngắn nhảy liên tục
  max_chars: {ja: 10, ko: 12, en: 22}
  size: 13
  color: [1.0, 1.0, 1.0]
  stroke_color: [0.0, 0.0, 0.0]
# Cỡ chữ theo thang của CapCut (15 = mặc định). Chọn lại sau khi xem dự án thử chữ (tools/build_text_test.py).
hook_text:              # chữ lớn dải trên trong hook: to, viền dày, có animation vào + rung lặp
  size: 32
  color: [1.0, 0.85, 0.0]
  stroke_color: [0.0, 0.0, 0.0]
  stroke_width: 0.16
  animations: [in, loop]
emphasis:
  size: 22
  color: [1.0, 0.85, 0.0]
  stroke_color: [0.0, 0.0, 0.0]
  stroke_width: 0.12
title:
  size: 13
  color: [1.0, 1.0, 1.0]
  stroke_color: [0.0, 0.0, 0.0]
zoom:
  punch_scale: 1.15
  punch_in_s: 0.15
  slow_scale: 1.1
music:
  duck_db: -10          # nhạc gốc -5 dB (config/audio.yaml); khi có thoại hạ thêm 10 dB
  fade_s: 0.25
hook:
  min_s: 3.0
  max_s: 5.0
beat_sync: {enabled: true, tolerance_s: 0.25, text_tolerance_s: 0.2}

# Trang trí (sticker, hiệu ứng, chuyển cảnh, filter) và bảng màu chữ nhấn (luân phiên)
decor_brief: "Sinh động: 1 hiệu ứng hình mỗi 8–12 giây ở điểm nhấn, 2–4 sticker cảm xúc cả video, chuyển cảnh 2–4 lần khi đổi ý, có filter."
emphasis_palette: [[1, 0.85, 0], [0.2, 0.9, 1], [1, 0.35, 0.6], [0.5, 1, 0.3]]
