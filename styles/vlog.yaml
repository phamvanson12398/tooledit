name: vlog
name_vi: Vlog / du lịch / đời thường
fits_vi: quay đời sống, du lịch, ăn uống, một ngày của..., cảnh đẹp, ít thoại hoặc thoại tự sự
description_vi: Kể chuyện theo hành trình, nhịp vừa, nhạc nền là linh hồn, cắt theo nhịp nhạc, chữ ít và nhẹ nhàng.

director_brief: |
  - Kể theo trình tự thời gian/hành trình; mỗi cảnh 2–6 giây, cắt ở động tác hoặc chuyển cảnh tự nhiên.
  - Giữ âm thanh hiện trường ở khoảnh khắc đẹp; chỗ không thoại để nhạc dẫn dắt.
  - Chữ nhấn ít (tối đa 1 / 10 giây): địa điểm, món ăn, cảm xúc ngắn.
  - Zoom "slow" là chính; "punch" hầu như không dùng.
  - Nhạc nền nổi bật hơn các kiểu khác (acoustic/chill/pop nhẹ), chọn đúng tâm trạng; chỉ hạ khi có thoại.
  - SFX rất ít.

