name: jp_telop
name_vi: テロップ Nhật (chữ nhấn giữa màn)
fits_vi: nội dung tiếng Nhật, talk/variety kiểu Nhật, cần テロップ theo cảm xúc
description_vi: Chữ nhấn lớn giữa màn, màu theo cảm xúc, nhịp vừa, SFX "pop" khi hiện chữ.

director_brief: |
  - テロップ: đặt chữ nhấn ở center cho câu nói đắt/phản ứng, viết đúng lời nói (có thể rút gọn), kèm dấu 「！」「…」 hợp cảm xúc.
  - Nhịp vừa: clip 2–6 giây, cắt khoảng lặng > 0.4 giây.
  - SFX "pop" khi hiện chữ nhấn quan trọng.
  - Zoom "punch" ở phản ứng, "slow" khi kể.
  - Nhạc nhẹ nhàng/vui tùy không khí, hạ khi có thoại.

