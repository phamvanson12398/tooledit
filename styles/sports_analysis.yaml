name: sports_analysis
name_vi: Thể thao – bình luận & phân tích tình huống
fits_vi: trận đấu boxing, bóng đá, bóng chày, bóng rổ, MMA...; highlight kèm bình luận/giải thích chiến thuật
description_vi: Dẫn dắt như bình luận viên - cho xem tình huống, tua lại chậm (replay) đúng khoảnh khắc quyết định, chữ phân tích chỉ ra điều người xem cần để ý.

director_brief: |
  - Cấu trúc: bối cảnh ngắn (ai đấu ai, tỉ số/hiệp) → diễn biến → TÌNH HUỐNG QUYẾT ĐỊNH → replay chậm → phân tích → kết quả/phản ứng.
  - Tình huống quyết định (cú đấm, bàn thắng, cú đánh bóng, pha cứu thua...) hãy thêm một clip REPLAY: lặp lại đúng đoạn đó
    với "replay": true và speed 0.35–0.6 (quay chậm). Replay được phép lặp lại đoạn footage đã dùng.
  - Chữ nhấn dùng như bình luận/phân tích ngắn: gọi tên kỹ thuật, chỉ điểm cần chú ý ("フック!", "ノーガード", "Counter!",
    "カウンター", "逆転"...). Đặt position top khi hình đang có hành động ở giữa. Không bịa thông số không có trong footage/lời bình.
  - Zoom "punch" đúng lúc va chạm/ghi bàn; "slow" khi phân tích.
  - Nhạc năng lượng cao (hype/epic/rock), hạ khi có lời bình. SFX: boom/whoosh ở khoảnh khắc quyết định, không lạm dụng.
  - Tốc độ: đoạn chờ/nhàm có thể 1.2–1.5; không tăng tốc đoạn hành động chính.

