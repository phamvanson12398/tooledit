# Góc máy tự động theo người đang nói (app/planner/camera.py). Chủ dự án yêu cầu 26/09: tránh giữ góc quay gốc,
# đổi góc nhiều và hợp lý nhất có thể.
camera:
  mode: speaker          # speaker = cắt cận người đang nói; bỏ dòng này để giữ nguyên khung gốc
  close_zoom: 2.0        # cận mặt: phóng ~2 lần
  medium_zoom: 1.4       # trung cảnh
  face_max: 0.45         # mặt không cao quá 45% khung cắt (tránh cận quá sát)
  max_hold_s: 4.5        # một người nói lâu: cứ ~4.5 giây đổi cận ↔ trung một lần
  min_shot_s: 1.2        # cảnh ngắn nhất; câu xen ngắn hơn không cắt sang người kia
  wide_open_s: 2.0       # mở đầu video bằng toàn cảnh 2 giây
  wide_every_s: 20       # ~20 giây chưa có toàn cảnh thì chèn một cảnh toàn

# Trang trí (sticker, hiệu ứng, chuyển cảnh, filter) và bảng màu chữ nhấn (luân phiên)
decor_brief: "Tiết chế: 0–2 hiệu ứng, 0–2 sticker, chuyển cảnh chỉ khi đổi chủ đề, filter nhẹ."
emphasis_palette: [[1, 1, 1], [1, 0.85, 0]]
