name: podcast
name_vi: Podcast / phỏng vấn / talk show
fits_vi: hai hoặc nhiều người ngồi nói chuyện, phỏng vấn, talk show, chia sẻ quan điểm
description_vi: Giữ trọn ý của người nói, cắt khoảng lặng và câu thừa, khung bám mặt người đang nói, chữ nhấn câu đắt.

director_brief: |
  - Chọn 1–3 ý đắt nhất, mỗi ý phải có mở–giải thích–chốt; KHÔNG cắt giữa câu, không đổi nghĩa lời người nói.
  - Cắt khoảng lặng > 0.5 giây, "ờ/à/えーと/음", câu lặp. Không tăng tốc (speed = 1.0).
  - Khung 1:1 khi cận mặt một người (nếu được đổi khung), 4:3 khi thấy cả hai người.
  - Chữ nhấn: trích nguyên văn câu gây chú ý nhất (ngắn gọn), tối đa 1 chữ nhấn / 8 giây, đặt position center.
  - Zoom "slow" nhẹ khi người nói kể chuyện, "punch" chỉ khi có câu chốt/tiếng cười.
  - Tiêu đề dải trên (title_top) nên có: chủ đề của đoạn nói chuyện.
  - Nhạc nền rất nhỏ, không át lời (lofi/piano/ambient), có thể null nếu đoạn nói đã đủ cuốn.
  - SFX rất ít (chỉ ở câu chốt).

