# Đạo diễn AI = Claude Code chạy trên máy, đăng nhập gói Claude Pro (KHÔNG dùng --bare: --bare bỏ qua
# đăng nhập Pro, chỉ nhận API key). Cờ lệnh đã đối chiếu với `claude --help` bản 2.1.282 và
# https://code.claude.com/docs/en/headless.
backend: claude_cli          # claude_cli | fake
default_ai: claude           # AI mặc định khi tạo job: claude | gemini (chọn lại được cho từng job ở trang chủ)
claude_exe: claude
model: null                  # null = mặc định của tài khoản; hoặc "sonnet", "opus"...
effort: null                 # null | low | medium | high
# Gemini Pro qua Antigravity CLI `agy` (chủ dự án chốt 11/10): đăng nhập tài khoản Google gói Google AI Pro, không cần
# API key. Cờ lệnh đối chiếu `agy --help` + chạy thử thật bản 1.3.3 (xem app/director/antigravity_cli.py).
agy_exe: agy                 # không có trong PATH thì tool tự tìm %LOCALAPPDATA%\agy\bin\agy.exe
agy_model: null              # null = mặc định của tài khoản; xem tên model bằng lệnh `agy models`
agy_effort: null             # null | low | medium | high | xhigh | max
max_attempts: 3              # số lần gọi lại khi JSON sai khuôn
timeout_s: 900
# Thư mục làm việc tạm cho đạo diễn, NẰM NGOÀI repo để Claude Code không nạp CLAUDE.md của dự án.
# Để trống = %LOCALAPPDATA%\tooledit\director (Windows) hoặc ~/.cache/tooledit/director.
workspace: null
frames:
  understand: 12             # số khung hình gửi cho bước hiểu nội dung (tiết kiệm hạn mức Pro)
  plan: 10                   # khung hình gửi khi lập kế hoạch cho kiểu dựng có mũi tên (thể thao)
# Kho tài nguyên lớn: mỗi nhóm chỉ liệt kê vài mục cho đạo diễn (tiết kiệm hạn mức Claude Pro)
prompt_limits: {sfx_per_mood: 3, sfx_total: 90, music_per_mood: 4, music_total: 60}
