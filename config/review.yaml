# Chế độ "REVIEW PHIM / HOẠT HÌNH" (chủ dự án yêu cầu 09/10): AI tìm các ĐOẠN HAY trong phim / hoạt hình, mỗi đoạn
# thành MỘT video review riêng dài 1 phút – 1 phút 30. Trên mỗi video là LỜI REVIEW (kể lại + bình luận) do AI viết,
# chủ dự án tự thu voice bằng Voice Studio; tiếng gốc của phim được HẠ NHỎ bên dưới (không tắt hẳn).
# Ngôn ngữ lời review = ngôn ngữ chọn ở ô "🌐 Đổi ngôn ngữ"; để "Giữ nguyên" thì dùng tiếng gốc (phải là Hàn / Nhật / Anh).
# Chủ dự án chốt 09/10: mỗi video review dài 2:30 (cho phép 2:10–2:30)
min_video_s: 130
max_video_s: 150
# Độ dài đoạn phim GỐC cho mỗi video (trước khi cắt gọn) — AI chọn đoạn liền trong khoảng này
min_raw_s: 140
max_raw_s: 420
segment_frames: 24      # số khung hình (rải đều cả phim) gửi AI xem khi tìm đoạn hay — hoạt hình ít thoại vẫn tìm đúng
# NHỊP CHUYỂN CẢNH theo video mẫu chủ dự án gửi 09/10 (57 lần cắt / 142 giây: trung bình 2.5s, phần lớn 1–2s):
max_clip_s: 6            # mỗi cảnh tối đa 6 giây (chỉ khoảnh khắc đắt mới dài vậy)
avg_clip_s: 3.0          # độ dài TRUNG BÌNH các cảnh không quá 3 giây (kiểm tra nới +0.5s)
layout: review_story     # bố cục như video mẫu (config/layout.yaml): nền tối, 2 dòng tiêu đề trắng + xanh lá, khối 9:10
# Lời review
# TỐC ĐỘ ĐỌC RIÊNG của giọng review (chữ / giây, không tính dấu cách, dấu câu). Đo từ voice mẫu chủ dự án gửi 09/10:
# "스펀지밥이 잡지에서 베프 퀴즈를 발견했습니다." = 20 chữ trong 2.3 giây ≈ 8.7 chữ/giây (nhanh hơn giọng thuyết minh 7.0).
# Ngôn ngữ chưa có ở đây thì dùng max_cps trong config/dub.yaml. Tool tự đo lại giọng review thật khi dựng
# (lưu config/local.yaml → review_voice_cps, tách riêng với giọng thuyết minh).
# Cập nhật 09/10: chủ dự án đọc "첫 문제는 '내 절친의 배꼽은 들어갔을까, 나왔을까?'였죠." (22 chữ) trong 2 giây ≈ 11
# chữ/giây → lấy 10. Sau lần dựng đầu, tool dùng ĐÚNG tốc độ đo từ voice thật (review_voice_cps), nhanh hơn cũng theo.
voice_cps: {ko: 10.0}
open_within_s: 1.0       # câu đầu cất lên ngay trong 1 giây đầu
# Chủ dự án chốt 09/10: review NÓI LIỀN MẠCH từ đầu tới cuối, KHÔNG ngừng để nghe tiếng phim — toàn bộ âm thanh là
# giọng review (+ nhạc nền nhẹ). Phim gốc chỉ lấy HÌNH.
min_cover: 0.9           # lời review phủ ≥ 90% thời lượng
max_cover: 1.01          # (không giới hạn trên)
max_gap_s: 0.6           # 2 câu liền nhau cách nhau tối đa 0.6 giây (chỉ đủ lấy hơi)
max_tail_s: 1.5          # câu cuối kết thúc trong 1.5 giây cuối video
# HÌNH CHẠY THEO GIỌNG (chủ dự án yêu cầu 09/10): khi dựng, tool đo độ dài voice thật của từng câu rồi co / giãn các
# cảnh của câu đó cho khớp — bạn đọc nhanh hay chậm thế nào video cũng khớp, giọng chạy liền không khoảng im.
voice_gap_s: 0.12        # nghỉ giữa 2 câu (giây)
min_clip_s: 0.4          # cảnh co còn ngắn hơn mức này thì bỏ bớt cảnh
# DỰNG TỪ VOICE (chủ dự án chốt 09/10): tool viết TRƯỚC bài lời đọc (mỗi câu ghi đoạn phim nó kể) → bạn đọc cả bài một
# file → tool cắt cảnh trong đoạn phim của từng câu, tổng đúng bằng độ dài câu đọc.
cut_s: 2.0               # mỗi cảnh dài khoảng 2 giây (câu 6 giây → 3 cảnh)
min_cut_s: 1.0           # cảnh ngắn nhất
min_footage_ratio: 0.9   # đoạn phim của mỗi câu phải dài ≥ 90% thời gian đọc câu đó
max_line_s: 12           # một câu đọc tối đa 12 giây
max_describe_share: 0.3  # tối đa 30% số câu được kiểu tả cảnh ("… đang …") — còn lại phải KỂ CHUYỆN (09/10)
frames: 80               # gửi AI khung hình của TỪNG cảnh (tối đa 80) để lời kể khớp đúng hình
# Tiếng gốc của phim dưới lời review
original_audio:
  mute: true             # TẮT HẲN tiếng phim (chủ dự án chốt 09/10) — false = chỉ hạ nhỏ theo 2 mức dưới
  db: -18                # (khi mute: false) dưới câu review đã có voice
  db_no_voice: -6        # (khi mute: false) chỗ không có lời review
# Lời review hay & tự nhiên (chủ dự án yêu cầu 09/10):
polish: true             # lượt 2: AI đọc lại cả bài như biên tập viên bản xứ, sửa cho tự nhiên (thêm 1 lần hỏi AI)
# Văn mẫu: dán lời các video review bạn thích vào config/review_style.txt — AI học giọng / nhịp theo đó.

