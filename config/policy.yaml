# Tuân thủ Nguyên tắc cộng đồng TikTok (https://www.tiktok.com/community-guidelines).
# Đạo diễn AI đánh dấu các đoạn vi phạm ở bước "hiểu nội dung"; tool CẮT BỎ các đoạn đó khỏi mọi video,
# không dùng trong hook, không viết lên màn hình.

enabled: true
pad_s: 0.15          # cắt rộng thêm mỗi bên (giây) để không sót nửa chữ
min_piece_s: 0.5     # mẩu clip còn lại sau khi cắt ngắn hơn mức này thì bỏ luôn
merge_gap_s: 0.6     # hai đoạn vi phạm cách nhau ít hơn mức này thì gộp làm một

# Từ tục máy tự dò trong transcript (có mốc giây từng từ) và trong chữ trên màn hình / hook / caption.
# Tiếng Anh: khớp theo đầu từ ("fuck" bắt cả "fucking"). Tiếng Hàn / Nhật: khớp chuỗi con.
# Danh sách cố ý ngắn để tránh cắt nhầm — thêm từ nếu cần. Đạo diễn AI vẫn tự phát hiện các trường hợp khác.
bad_words:
  en: [fuck, motherfuck, shit, bitch, cunt, asshole, dickhead, bastard]
  ko: [씨발, 시발, 씨바, 개새끼, 개새기, 병신, 좆, 존나, 지랄, 미친놈, 미친년]
  ja: [死ね, ぶっ殺す, 殺すぞ, くたばれ]

# Nhắc tới nền tảng khác ngoài TikTok (tên nền tảng, lời kêu gọi kiểu YouTube "subscribe / 구독 / チャンネル登録").
# Không được có trong caption, hashtag, chữ trên màn hình, câu hook; trong lời thoại thì bị CẮT.
# Luôn xét cả 3 danh sách với mọi video (video tiếng Hàn/Nhật vẫn hay nói "YouTube").
# Câu thoại ngắn (≤ platform_sentence_s giây) chứa tên nền tảng thì cắt cả câu, câu dài thì chỉ cắt đúng từ đó.
# Cố ý không đưa từ dễ nhầm (vd "shorts" = quần short, "インスタント" = mì ăn liền) — đạo diễn AI tự nhận ra các ca khác.
platform_sentence_s: 6.0
other_platforms:
  en: [youtube, youtuber, instagram, facebook, twitch, twitter, snapchat, douyin, kuaishou, bilibili, niconico,
       weibo, patreon, onlyfans, discord, subscribe, "hit the bell", "yt shorts", "ig reels", "instagram reels"]
  ko: [유튜브, 유투브, 유튜버, 인스타, 페이스북, 트위터, 트위치, 아프리카tv, 아프리카티비, 치지직, 쇼츠, 릴스,
       "구독과 좋아요", "구독 좋아요", "구독, 좋아요", 구독버튼, "구독 버튼", "채널 구독", "알림 설정"]
  ja: [ユーチューブ, ユーチューバー, インスタグラム, インスタライブ, フェイスブック, ツイッター, ツイキャス,
       ニコニコ動画, ニコ生, チャンネル登録, 高評価ボタン, 高評価お願い, "高評価と"]
