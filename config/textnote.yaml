# CHẾ ĐỘ "🔤 DỊCH CHỮ TRÊN MÀN HÌNH" (chủ dự án yêu cầu 17/11 — thay chế độ "Chữ theo hành động" cùng ngày)
# MỘT video, giữ NGUYÊN hình + tiếng gốc (không cắt — trừ đoạn vi phạm chính sách, không nhạc, không voice). Tool tự thấy
# CHỮ CÓ SẴN trên màn hình (phụ đề cứng, chú thích, tiêu đề in trong video gốc), dịch sang ngôn ngữ chọn khi tạo job, CHE
# chữ gốc bằng dải nền rồi viết chữ dịch đè lên đúng chỗ đó, đúng lúc chữ gốc hiện.
analysis_frames: 240          # bước phân tích: trích tối đa chừng này khung…
frame_every_s: 1.0            # …mỗi giây một khung (chữ hiện ngắn cũng bắt được)
frames: 120                   # số khung gửi AI đọc chữ (ghép ảnh lưới); video dài hơn thì rải đều
transcript_chars: 3000        # lời nói gốc gửi kèm (giúp hiểu ngữ cảnh khi dịch)
min_item_s: 0.5               # chữ hiện ngắn hơn chừng này thì bỏ
min_box: 0.01                 # hộp chữ phải rộng / cao ít nhất 1% khung
# máy chỉnh lại cho khít (OpenCV, trên các khung đã trích): vị trí hộp + lúc chữ thật sự hiện
refine: true
refine_expand: 0.3            # tìm chữ trong vùng AI báo nới rộng thêm 30%
refine_density: 0.08          # tỉ lệ điểm "giống chữ" tối thiểu để coi là đang có chữ
# dải che chữ gốc + chữ dịch
cover_color: "#000000"
cover_alpha: 0.85             # gần đặc: không còn thấy chữ cũ (1 = đặc hẳn)
cover_round: 0.25
cover_pad: 0.15               # dải rộng hơn hộp chữ 15%
text_color: [1, 1, 1]
text_fill: 0.8                # chữ dịch cao ~80% dải, tự thu nhỏ cho vừa chiều ngang
