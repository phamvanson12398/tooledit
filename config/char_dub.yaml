# Chế độ "LỒNG TIẾNG NHÂN VẬT" (chủ dự án yêu cầu 11/10): chọn các ĐOẠN HAY hợp người xem TikTok trong một video, dịch
# thoại từng nhân vật sang ngôn ngữ đích (vd Nhật → Hàn), chủ dự án thu voice cho TỪNG NHÂN VẬT rồi tải lên; tiếng nói
# gốc được tách bỏ (Demucs), NHẠC + TIẾNG NỀN GỐC GIỮ NGUYÊN; hình chỉ cắt bỏ đoạn rề rà, không đổi khung / lật / filter.
min_video_s: 60          # mỗi video tối thiểu 1 phút
max_video_s: 120         # tối đa 2 phút (đoạn hay TikTok — gọn, không lê thê)
situation_s: [10, 20]    # chủ dự án yêu cầu 11/10: chọn từng TÌNH HUỐNG ngắn 10–20 giây rồi ghép vài tình huống
                         # thành một video (không lấy một khúc 80 giây liền); máy chấp nhận 7–30 giây
min_raw_s: 60            # khoảng phim gốc từ tình huống đầu tới tình huống cuối của mỗi video
max_raw_s: 900
max_line_s: 7.0          # câu thoại gốc dài hơn thì tách ở chỗ ngắt (giọng lồng bám miệng sát hơn)
keep_unvoiced: true      # giữ GIỌNG GỐC ở chỗ không có câu lồng tiếng (tiếng cười, hét, câu Whisper nghe sót) thay vì
                         # im lặng; tắt đúng trong các câu lồng tiếng (cần Demucs)
unvoiced_db: 0           # âm lượng giọng gốc ở các chỗ đó (dB)
# Bắt lời thoại gốc đầy đủ hơn (chủ dự án 11/10: "nhiều khi không bắt được tiếng gốc"): nhận dạng LẠI trên phần giọng
# nói Demucs đã tách khỏi nhạc (analysis/audio/vocals_00.wav), bộ lọc giọng nói nhạy hơn mặc định (faster-whisper 1.2.1
# mặc định: threshold 0.5, phải lặng 2000 ms mới tách câu, pad 400 ms). Chưa cài Demucs thì giữ lời thoại cũ.
vocals_transcribe: true
whisper_options:
  vad_parameters: {threshold: 0.3, min_silence_duration_ms: 500, speech_pad_ms: 200}
  condition_on_previous_text: false   # phim nhiều nhạc: tránh Whisper lặp / bịa câu theo câu trước
  batched: false                      # đoạn ngắn → chạy thường (chính xác hơn chạy theo lô)
# Nghe lại chỗ sót (chủ dự án 11/10 "cứ bắt sót câu"): chỗ giọng nói đã tách nhạc CÓ tiếng người mà chưa có câu nào →
# nhận dạng lại riêng, không qua bộ lọc giọng nói. rescue_rel_db: tiếng nhỏ hơn mức giọng nói chừng này dB vẫn tính.
rescue_gaps: true
rescue_rel_db: 28
rescue_min_s: 0.45
rescue_max: 60
# Nhóm giọng (máy đo cao độ + âm sắc từng câu trên giọng nói đã tách): câu cùng nhóm thường cùng một nhân vật → AI ghi tên
# nhân vật đúng và thống nhất; trang voice hiện nhóm giọng từng câu. voice_group_threshold nhỏ hơn = tách nhóm kỹ hơn.
voice_groups: true
voice_group_threshold: 0.35
frames: 40               # khung hình gửi AI để nhận ra nhân vật nào đang nói
# Nhận diện nhân vật: AI đoán người nói từng câu theo lời thoại (tên gọi, xưng hô, ngữ cảnh) + khung hình. Có thể nhầm —
# sửa tên nhân vật từng câu ngay trên trang voice trước khi thu.
