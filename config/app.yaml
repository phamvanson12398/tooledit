# Chạy nhiều video cùng lúc (mỗi video một "luồng"). Chủ dự án yêu cầu 27/09.
parallel:
  jobs: 3          # số video chạy cùng lúc (đổi được trên giao diện); video thêm vào sau sẽ xếp hàng
  # Bước nặng dùng chung tài nguyên máy nên phải lần lượt / giới hạn:
  analyze: 2       # số video phân tích cùng lúc (dò cảnh, dò mặt dùng CPU)
  gpu: 1           # nhận dạng thoại Whisper trên GPU GTX 1080 Ti — 1 video một lúc cho khỏi tràn bộ nhớ GPU
  director: 2      # số lần hỏi đạo diễn AI cùng lúc (dùng chung hạn mức Claude Pro)
  write: 2         # ghi draft CapCut

# Tự xóa job không hoạt động quá N ngày (0 = không tự xóa). Đổi được trên giao diện.
# Chỉ xóa dữ liệu trong jobs/ (phân tích, kế hoạch, caption...); footage gốc và draft trong CapCut không bị xóa.
cleanup_days: 2
