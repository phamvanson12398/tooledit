# Chế độ "Đổi ngôn ngữ" (video short): video gốc nói một thứ tiếng (ko/ja/en/zh), bản TikTok được
# THUYẾT MINH (voice tự thu bằng Voice Studio) + PHỤ ĐỀ bằng ngôn ngữ khác (ko/ja/en), và dựng lại khác hẳn bản gốc.

targets: [ko, ja, en]          # ngôn ngữ đích được chọn trên giao diện
mute_original: true            # TẮT HẲN tiếng gốc của video (chủ dự án chốt 02/10): chỉ còn voice thuyết minh + nhạc + SFX
# Khi mute_original: false thì tiếng gốc chỉ hạ nhỏ theo 2 mức dưới:
original_db: -20               # dưới câu đã có voice thuyết minh
original_db_no_voice: -6       # chỗ khác / câu chưa có file voice
max_speed: 1.25                # file thuyết minh dài hơn chỗ trống → tăng tốc tối đa mức này
# Chống ĐÈ TIẾNG (chủ dự án yêu cầu 05/10, video gốc nói nhiều): voice không bao giờ chồng lên nhau — câu sau chờ câu
# trước nói xong (trễ tối đa max_delay_s rồi bắt kịp ở chỗ lặng); không vừa thì tăng tốc thêm tới hard_max_speed.
hard_max_speed: 1.4
max_delay_s: 0.8
write_cps_factor: 0.85         # AI viết câu nhắm 85% tốc độ tối đa (chừa chỗ lấy hơi)
use_measured_rate: true        # dùng tốc độ đọc THẬT đo từ voice bạn đã thu (config/local.yaml → voice_cps) nếu chậm hơn
dense_ratio: 0.7               # lời chiếm ≥ 70% thời gian = video nói dày đặc → AI nén ý
dense_keep: 0.75               # nén còn ~75% độ dài lời gốc
line_s: [1.5, 9.0]
# AI viết thuyết minh 3 lần vẫn còn lỗi nhỏ (vài câu hơi nhiều chữ so với chỗ trống...):
#   false = dừng, trang lỗi có nút "Dùng bản thuyết minh gần nhất" để bạn tự quyết (không phải hỏi lại AI)
#   true  = tự dùng luôn bản gần nhất (câu nào dài quá thì voice được tăng tốc / có cảnh báo lúc dựng)
accept_imperfect: false
# Phụ đề TIẾNG VIỆT (nghĩa từng câu) ngay dưới phụ đề chính để chủ dự án kiểm tra voice / phụ đề đã khớp chưa
# (chủ dự án yêu cầu 03/10). Bật / tắt cho từng job ở trang job; TẮT rồi dựng lại trước khi xuất video đăng TikTok.
vi_subtitles:
  enabled: true               # mặc định cho job mới
  size: 8                     # nhỏ hơn phụ đề chính
  color: [1, 0.95, 0.4]       # vàng nhạt, dễ phân biệt
  gap: 0.075                  # khoảng cách xuống dưới phụ đề chính (nửa khung)
  max_chars: 34               # mỗi cụm tối đa 34 ký tự             # mỗi câu thuyết minh dài 1.5–9 giây (một ý trọn vẹn)

# Cách viết lời thuyết minh (chủ dự án yêu cầu 07/10), chọn khi tạo job:
#   rewrite   = AI XEM video (khung hình + lời gốc để hiểu) rồi VIẾT MỚI nội dung hợp khán giả nước đích (mặc định)
#   translate = dịch sát lời gốc (+ lời dẫn ở chỗ im lặng)
default_script_mode: rewrite
rewrite:
  frames: 16                   # số khung hình gửi AI xem (rải đều các clip được giữ)
  open_within_s: 1.5           # câu đầu tiên phải cất lên trong 1.5 giây đầu
  max_cover: 0.9               # lời chiếm tối đa 90% thời lượng (chừa chỗ thở)

# Chỗ KHÔNG có giọng nói (chủ dự án chốt 01/10): AI viết LỜI DẪN, nhưng CHỈ ở cảnh hay / hành động đáng chú ý
# (vd video nấu ăn: lúc thêm gia vị, lật miếng thịt, món ra lò) — không nói liên tục; chỗ khác để nhạc + tiếng hiện trường.
narration:
  min_gap_s: 2.0               # khoảng lặng thoại từ 2 giây trở lên được đưa cho AI xem để tìm hành động đáng nói
  max_cover_ratio: 0.6         # tổng lời dẫn tối đa 60% thời gian lặng (để có chỗ thở)
  keep_reactions: true         # khoảng lặng chủ yếu là tiếng cười / hò reo thì không lồng lời dẫn
  # Mở đầu im lặng (vd chỉ show món ăn / sản phẩm, chưa ai nói): BẮT BUỘC có lời dẫn mở đầu kiểu video nấu ăn —
  # gần gũi, gợi thèm, gợi tò mò cách làm (chủ dự án chốt 01/10).
  opening:
    enabled: true
    within_s: 1.0              # khoảng lặng bắt đầu trong 1 giây đầu video (sau hook) = mở đầu im lặng
    min_len_s: 2.0             # và dài từ 2 giây
    start_by_s: 1.0            # lời dẫn mở đầu phải cất lên trong 1 giây đầu của khoảng lặng đó
  frames: 12                   # gửi tối đa 12 khung hình ở các khoảng lặng để AI thấy hành động

# Tốc độ nói tối đa (ký tự / giây, không tính dấu cách, dấu câu) — để câu dịch đọc kịp trong chỗ trống.
max_cps: {ja: 8.0, ko: 7.0, en: 16.0}

# "Khác bản gốc ~80%": ghi đè lên phong cách đang chọn (không đảo thứ tự cảnh — chủ dự án chốt 01/10)
style_override:
  remix: true
  reorder: false
  cold_open: false
  motion: {every_clip: true, max_scale: 1.2}
  # Phản chiếu ngang một phần cảnh (chủ dự án yêu cầu 01/10): ~40% số cảnh, rải đều, theo cảnh (cùng cảnh cùng chiều).
  # Tự TẮT khi footage có chữ in sẵn / logo / bảng hiệu (AI báo ở bước hiểu nội dung) để không lộ chữ ngược.
  mirror: {share: 0.4, min_scenes: 3, skip_burned_in: true}
# Góc máy bám người (chỉ dùng khi phong cách chưa có cấu hình camera riêng)
camera_default:
  mode: speaker
  close_zoom: 1.7
  medium_zoom: 1.3
  face_max: 0.45
  max_hold_s: 3.5
  min_shot_s: 1.2
  wide_open_s: 1.5
  wide_every_s: 15

# CHẾ ĐỘ "CHỈ THAY TIẾNG" (chủ dự án chốt 06/10, video short): giữ NGUYÊN hình — không cắt, không đổi thứ tự, không đổi
# khung / zoom / lật, không tua nhanh. Chỉ thay tiếng: tắt tiếng gốc, voice thuyết minh + phụ đề + tiêu đề bằng ngôn ngữ
# đích, nhạc nền nhẹ, hiệu ứng / sticker / SFX. Đoạn vi phạm chính sách TikTok vẫn bị cắt.
voice_only:
  music_base_db: -12           # nhạc nền nhẹ hơn các chế độ khác (mặc định -5 dB)
  allow_filter: false          # không đổi màu hình
  allow_emphasis: false        # không thêm chữ nhấn (chỉ phụ đề + tiêu đề)
  # "Giữ nhạc nền gốc" (07/10): tách giọng nói khỏi âm thanh gốc bằng Demucs (requirements-bgm.txt), giữ phần nhạc +
  # tiếng nền, thay lời bằng voice thuyết minh; không thêm nhạc AI. Chưa cài Demucs → dùng nhạc AI như thường + báo.
  keep_bgm:
    model: htdemucs
    device: auto               # auto = GPU nếu có, không thì CPU; hoặc "cpu" / "cuda"
    volume_db: 0               # độ to nhạc gốc lúc không có voice
    duck_db: -8                # hạ thêm khi voice thuyết minh đang nói
  style_override:
    keep_footage: true
    remix: false
    reorder: false
    cold_open: false
    arrows: false
    motion: null
    mirror: null
    camera: null
    beat_sync: {enabled: false}
    director_brief: |
      - CHẾ ĐỘ CHỈ THAY TIẾNG: hình giữ nguyên 100%. Danh sách clip do tool tự đặt = TOÀN BỘ video từ đầu đến cuối
        (bạn cứ trả 1 clip 0 → hết video, speed 1.0). KHÔNG zoom, KHÔNG replay, KHÔNG chuyển cảnh, KHÔNG mũi tên.
      - Việc của bạn: tiêu đề (titles_top / titles_bottom / topic_label) bằng ngôn ngữ đích, nhạc nền nhẹ hợp tâm trạng,
        và hiệu ứng / sticker / SFX ở đúng khoảnh khắc đáng nhấn — tiết chế, không che mặt / chủ thể.
