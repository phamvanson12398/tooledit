# Bố cục khung 9:16. Chủ dự án chốt (video mẫu 25/09): MỌI video dùng bố cục "four_titles".
#   four_titles = nền đen · khối video 16:9 tràn ngang ở giữa · 2 dòng tiêu đề lớn phía trên + 2 dòng phía dưới
#                 cố định suốt video · phụ đề thoại nằm TRONG khối video (mép dưới) · nhãn chủ đề nhỏ góc trên phải khối.
#   classic     = bố cục cũ: khối 4:3 / 1:1 + nền mờ + phụ đề ở dải dưới.
# Tọa độ: tính theo PHẦN CHIỀU CAO KHUNG từ trên xuống (0 = mép trên, 1 = mép dưới); đo từ video mẫu 720x1280.
preset: four_titles
# Kiểu dựng có thể tự chọn bố cục riêng bằng khóa `layout:` trong styles/<kiểu>.yaml (ví dụ sports_analysis → sports_focus).

four_titles:
  titles: true
  # Chủ dự án chốt 07/10: CHỈ 2 dòng tiêu đề phía trên (bỏ 2 dòng dưới), nền mặc định TRẮNG, chữ tiêu đề ĐEN.
  bottom_titles: false         # true = có lại 2 dòng tiêu đề phía dưới
  background_color: "#FFFFFFFF"
  block_ratio: "16:9"          # tỉ lệ khối dùng để ĐO các vị trí bên dưới (theo video mẫu)
  # Khung video trên màn = khung người dùng chọn khi tạo job (4:3 / 1:1 / 16:9); các vị trí bên dưới tự dời theo khung.
  # (Chủ dự án bỏ khung cố định 3:4 ngày 02/10. Muốn bật lại: thêm `frame_ratio: "3:4"` và `frame_lock: true`.)
  # tâm 4 dòng tiêu đề (2 trên, 2 dưới). Dòng 4 lấn vào vùng caption TikTok như video mẫu — chỉnh nếu bị che.
  title_rows: [0.094, 0.262, 0.745, 0.893]
  subtitle_row: 0.612          # phụ đề thoại: mép dưới khối video (khối nằm 0.342–0.658)
  emphasis_row: 0.5            # chữ nhấn: giữa khối video
  topic_row: 0.362             # nhãn chủ đề nhỏ góc trên phải khối
  topic_x: 0.30                # (nửa khung, dương = sang phải)
  # Tự canh cỡ chữ tiêu đề cho dòng tràn gần hết chiều ngang (giống video mẫu):
  title_width: 0.94            # chiều rộng mong muốn của mỗi dòng (phần chiều ngang khung)
  title_size: 20               # cỡ chữ tiêu đề trong CapCut (chủ dự án chốt 02/10: giảm từ 30 xuống 20)
  # Độ rộng 1 ký tự CJK trên mỗi đơn vị cỡ chữ (phần chiều ngang khung). ƯỚC LƯỢNG [CẦN KIỂM TRA TRÊN MÁY]:
  # chữ tiêu đề trong CapCut to quá → TĂNG số này; nhỏ quá → GIẢM.
  char_width_per_size: 0.0017
  title_scale_max: 1.0         # không phóng to thêm (giữ đúng cỡ 20); dòng quá dài thì tự thu nhỏ cho vừa khung
  # Màu 4 dòng (theo video mẫu; CapCut chưa ghi được gradient/phát sáng bằng code nên dùng màu trơn + viền dày)
  title_styles:                # chữ đen (viền trắng mảnh để vẫn đọc được khi chữ đè lên hình ở video dọc)
    - {color: [0, 0, 0], stroke_color: [1, 1, 1], stroke_width: 0.08}
    - {color: [0, 0, 0], stroke_color: [1, 1, 1], stroke_width: 0.08}
    - {color: [0, 0, 0], stroke_color: [1, 1, 1], stroke_width: 0.08}
    - {color: [0, 0, 0], stroke_color: [1, 1, 1], stroke_width: 0.08}
  subtitle: {size: 11, color: [1, 1, 1], stroke_color: [0, 0, 0], stroke_width: 0.16}
  topic: {size: 7, color: [1, 1, 1], stroke_color: [0.1, 0.25, 0.85], stroke_width: 0.2}
  # giới hạn ký tự mỗi dòng tiêu đề (đạo diễn phải viết ngắn để chữ to)
  title_max_chars: {ja: 12, ko: 12, en: 22}
  # Video kín màn hình (footage dọc 9:16 ở chế độ chỉ thay tiếng): chữ đè lên hình ở các hàng này.
  # ƯỚC LƯỢNG [CẦN KIỂM TRA TRÊN MÁY]: dòng dưới cùng không được lấn vào caption / tên tài khoản TikTok (~0.80 trở xuống).
  overlay:
    title_rows: [0.11, 0.18, 0.67, 0.74]
    subtitle_row: 0.58
    topic_row: 0.24
    title_scale_max: 0.8

# Review phim / hoạt hình (video mẫu chủ dự án gửi 09/10 — review SpongeBob tiếng Hàn): nền tối · 2 dòng tiêu đề cố định
# phía trên (dòng 1 trắng, dòng 2 XANH LÁ, viền đen) · khối phim 9:10 (0.183–0.82 chiều cao) cắt giữa khung 16:9 bám
# nhân vật · phụ đề trắng viền đen cụm ngắn ở ~2/3 khối phim.
review_story:
  titles: true
  bottom_titles: false
  background_color: "#0B0B0BFF"
  block_ratio: "9:10"
  frame_ratio: "9:10"          # khung cố định như video mẫu (không theo ô Khung video lúc tạo job)
  title_rows: [0.07, 0.132, 0.9, 0.95]   # chỉ dùng 2 dòng đầu
  subtitle_row: 0.64
  emphasis_row: 0.45
  topic_row: 0.2
  topic_x: 0.30
  title_width: 0.62
  title_size: 20
  char_width_per_size: 0.0017
  title_scale_max: 1.0
  title_styles:
    - {color: [1, 1, 1], stroke_color: [0, 0, 0], stroke_width: 0.12}
    - {color: [0.35, 1, 0.3], stroke_color: [0, 0, 0], stroke_width: 0.12}
    - {color: [1, 1, 1], stroke_color: [0, 0, 0], stroke_width: 0.12}
    - {color: [1, 1, 1], stroke_color: [0, 0, 0], stroke_width: 0.12}
  subtitle: {size: 11, color: [1, 1, 1], stroke_color: [0, 0, 0], stroke_width: 0.18}
  subtitle_max_chars: {ja: 9, ko: 10, en: 18}   # cụm ngắn ~1 nhịp nói như video mẫu
  topic: {size: 7, color: [1, 1, 1], stroke_color: [0.1, 0.25, 0.85], stroke_width: 0.2}
  title_max_chars: {ja: 10, ko: 10, en: 20}

# Thể thao / boxing (video mẫu 25/09): nền đen · khối video gần vuông 9:10 phóng to vào pha đấu, bám theo người ·
# KHÔNG có dòng tiêu đề · phụ đề cụm ngắn chữ vàng viền đen ở 2/3 khối video · mũi tên xanh lá chỉ vào chi tiết
# (găng, chân, bóng) · chuyển cảnh mờ, quay chậm pha quyết định.
sports_focus:
  titles: false
  background_color: "#000000FF"
  block_ratio: "9:10"          # khối 0.186–0.814 chiều cao như video mẫu (dùng để đo vị trí)
  subtitle_row: 0.62
  emphasis_row: 0.5
  topic_row: 0.24              # chữ nhấn "top" / nhãn REPLAY: gần mép trên khối video
  subtitle: {size: 13, color: [1, 0.92, 0.1], stroke_color: [0, 0, 0], stroke_width: 0.2}
  subtitle_max_chars: {ja: 7, ko: 8, en: 14}   # cụm rất ngắn, nhảy theo lời nói như video mẫu
  arrow:
    glyph: "→"                 # ký tự mũi tên (xoay theo hướng). [CẦN KIỂM TRA TRÊN MÁY] font CapCut có hiện không
    size: 40
    color: [0.2, 1, 0.25]
    stroke_color: [0, 0.35, 0.05]
    stroke_width: 0.12
    offset_px: 120             # khoảng từ điểm cần chỉ tới tâm mũi tên (px trên khung 1080x1920)
